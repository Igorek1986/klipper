#     M107
#     #retract
#     G91
#     G1 E-{E} F1500
    
#     G90
#     {% if max_layer_z < max_print_height %}
#     # Переместить печатающую головку вверх, если текущий слой ниже максимальной высоты печати
#     G1 Z{ z_offset + (max_layer_z + 2, max_print_height)|min } F600
#     {% endif %}
    
