#     {% set max_print_height = params.MAX_PRINT_HEIGHT|default(240) %}
#     {% set print_bed_max_y = params.PRINT_BED_MAX_Y|default(230) %}
#     {% set travel_speed = params.TRAVEL_SPEED|default(150) %}
#     {% set E = printer["gcode_macro START_PRINT"].retract|float %}
    
#     # Отключить нагрев стола и эктрудера
#     TURN_OFF_HEATERS
