[bot]
server: localhost

[camera]
# host: http://localhost:8080/webcam?action=stream
host: http://localhost:8080/?action=stream
flip_vertically: false
flip_horizontally: false
video_duration: 15

[progress_notification]
percent: 10
# height: 5
# time: 60
# min_delay_between_notifications: 60

[timelapse]
cleanup: true
# height: 0.1
# time: 5
height: 0
time: 0
after_photo_gcode: TIMELAPSE_RESUME_PRINT
target_fps: 30
manual_mode: true

[secrets]
secrets_path: /home/user/klipper_config/secrets.conf

[status_message_content]
content: progress, height, filament_length, filament_weight, print_duration, eta, finish_time, m117_status, tgnotify_status, last_update_time
heaters: extruder, heater_bed
