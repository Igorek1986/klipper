[gcode_macro START_PRINT]
variable_filament_diameter: 1.75
gcode:
  {% set x_park_d = printer.toolhead.axis_minimum.x|float + 10 %}
  {% set y_park_d = printer.toolhead.axis_maximum.y|float - 10 %}
  {% set travel_speed = printer.toolhead.max_velocity|int %}

  {% set extruder_temp = params.EXTRUDER_TEMP|float %}
  {% set bed_temp = params.BED_TEMP|float %}
  {% set first_layer_speed = params.FIRSTS|float %}
  {% set extruder_preheat_delta = params.EXTRUDERPD|default(60)|float %}
  {% set x_park = params.PARKX|default(x_park_d)|float %}
  {% set y_park = params.PARKY|default(y_park_d)|float %}
  {% set z_park = params.PARKZ|default(50)|float %}
  
  {% set filament_d = params.FILAMENT_DIAMETER|default(1.75)|float %}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=filament_diameter VALUE={filament_d}

  {% if "TOTAL_LAYER" in params %}
  SET_PRINT_STATS_INFO TOTAL_LAYER={params.TOTAL_LAYER}
  {% endif %}

  {% set prepare_b = bed_temp|int|string not in printer.bed_mesh.profiles %}

# Сетка по температуре. Подготовка сетки или загрузка из памяти. 
  # {% if prepare_b == True %}
  # M118 Bed mesh will be prepared for {bed_temp}
  # {% else %}
  # M118 Activating bed mesh: {bed_temp}
  # BED_MESH_PROFILE LOAD={bed_temp|int}
  # {% endif %}

  CLEAR_PAUSE
  M117 Starting
  
  G21 ; set units to millimeters
  G90 ; use absolute coordinates
  M83 ; extruder relative mode
  
  M140 S{bed_temp} ; set bed temp
  {% set extruder_preheat_temp = extruder_temp - extruder_preheat_delta %}
  {% if not prepare_b and printer.extruder.temperature > extruder_preheat_temp %}
  PREHEAT HEATER=extruder TARGET={extruder_temp} ; set extruder temp
  {% else %}
  PREHEAT HEATER=extruder TARGET={extruder_preheat_temp} ; set extruder temp
  {% endif %}
  
  G28
  G1 X{x_park} Y{y_park} Z{z_park} F{travel_speed * 60}
  
  {% if printer.heater_bed.target != bed_temp %}
  M117 Waiting for bed temp
  M190 S{bed_temp} ; wait for bed temp
  G4 P{60 * 1000} ; пауза 60 секунд
  {% endif %}
  
  G28 Z

# Адаптивная сетка
  PREPARE_BED
  G28 Z
# Сетка по температуре
  # {% if prepare_b %} 
  # PREPARE_BED
  # G28 Z
  # {% endif %}

  G1 X56 Y-10 Z{z_park} F{travel_speed * 60}

  M117 Waiting for extruder temp
  M109 S{extruder_temp} ; wait for extruder temp

  PRINT_INTRO_LINE SPEED=80
  M117 Printing
  
  TIMELAPSE_START

[gcode_macro PRINT_INTRO_LINE]
gcode:
  {% set travel_speed = printer.toolhead.max_velocity|int %}
  {% set speed = params.SPEED|float %}

  {% set retract = 1 %}
  {% set retract_speed = 30 %}

  {% set wipe_amount = 40 / printer["gcode_macro START_PRINT"].filament_diameter|float %}

  M117 Printing intro line

# капля в стол
  G1 X56 Y-5 F{travel_speed * 60}
  # Вывод координат после перемещения
  M118 Coordinates after G1 X56 Y-5: X={printer.toolhead.position.x}, Y={printer.toolhead.position.y}, Z={printer.toolhead.position.z}
  G1 Z-1 F{travel_speed * 60}
  # Вывод координат после G1 Z-0.2
  M118 Coordinates after G1 Z-1: X={printer.toolhead.position.x}, Y={printer.toolhead.position.y}, Z={printer.toolhead.position.z}
  G1 Y3 E{wipe_amount} F60
  G1 Z0.28 F{travel_speed * 60} 

[gcode_macro PREPARE_BED]
gcode:
  {% set travel_speed = printer.toolhead.max_velocity|int %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% else %}
    G28 Z
  {% endif %}
  M117 Calibrating bed mesh

  BED_MESH_CALIBRATE ADAPTIVE=1

# Сетка по температуре
  # BED_MESH_CALIBRATE
  # BED_MESH_PROFILE SAVE={printer.heater_bed.target|int}

[gcode_macro END_PRINT]
gcode:
  {% set retract = params.RETRACT_DIST|default(2)|float %}
  {% set extrude_speed = params.RETRACT_SPEED|default(40)|float %}
  {% set z_lift = params.Z_LIFT|default(100)|float %}
  {% set travel_speed = printer.toolhead.max_velocity|int %}
  {% set z_speed = printer.configfile.config.printer.max_z_velocity|int %}
  {% set x_park = printer.toolhead.axis_minimum.x|float + 5 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float %}

  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float - 1 %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 10.0) %}
      {% set z_safe = act_z + 10.0 %}
  {% else %}
      {% set z_safe = max_z %}
  {% endif %}
  ##### end of definitions #####

  G92 E0
  M83

  M117 Print finished
  G1 E-{retract} F{extrude_speed * 60}; retract
  G1 Z{z_safe} F{z_speed * 60}
  G1 X{x_park} Y{y_park} F{travel_speed * 60}

  M400
  G4 P1000
  TIMELAPSE_PHOTO
  TIMELAPSE_END

  M140 S0 ; turn off heatbed
  M104 S0 ; turn off temperature
  M107 ; turn off fan
  M84 ; disable motors

  #POWER_LOSS_CLEAR
  M117
  # Уведомление о завершении печати
  RESPOND PREFIX=tgnotify MSG="Печать завершена"

[gcode_macro AFTER_LAYER_CHANGE]
gcode:
  SET_PRINT_STATS_INFO CURRENT_LAYER={params.CURRENT_LAYER}
  M117 Layer {params.CURRENT_LAYER}/{printer.print_stats.info.total_layer}


# Макрос для смены филамента
[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    RESPOND PREFIX=tgalarm MSG="Change Filament"
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

#Новые для смены на нужном слое
# Если тип пластика 4, то устанавливаниется пауза через SET_PAUSE_AT_INFILL
# [gcode_macro PRINT_FEATURE]
# variable_pause_infill_layer: 0
# gcode:
#   {% if params.TYPE == "4" and printer.print_stats.info.current_layer == pause_infill_layer %}
#   SET_PAUSE_AT_INFILL LAYER=0
#   PAUSE
#   {% endif %}

# [gcode_macro SET_PAUSE_AT_INFILL]
# gcode:
#   SET_GCODE_VARIABLE MACRO=PRINT_FEATURE VARIABLE=pause_infill_layer VALUE={params.LAYER}

# Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0|1]] [MACRO=<name>]
# Включение паузы на следующем слое: SET_PAUSE_NEXT_LAYER ENABLE=1
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE | default(1) | int != 0 %}
  {% set MACRO = params.MACRO | default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0|1]] [LAYER=<number>] [MACRO=<name>]
# Установка паузы на слое 10: SET_PAUSE_AT_LAYER LAYER=10
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE | int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER | default(pause_at_layer.layer) | int %}
  {% set MACRO = params.MACRO | default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    {action_respond_info("%s, forced by pause_next_layer" % pause_next_layer.call)}
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    {action_respond_info("%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer))}
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}  